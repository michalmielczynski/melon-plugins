## melon.sony - maksymalna jakość dźwięku po Bluetooth (Sony WF-1000XM5).
##
## 1. LDAC 990 kbps ("hq") zamiast adaptacyjnego zjazdu w dół.
## 2. Kodeki w kolejności preferencji - LDAC pierwszy, SBC-XQ jako zapas.
## 3. Bez automatycznego przeskoku na profil mikrofonowy (HFP/mSBC), który
##    zjada jakość, gdy tylko jakaś aplikacja otworzy mikrofon. Profil
##    mikrofonowy zostaje dostępny, ale włącza się wyłącznie ręcznie.
##
## Wymaga restartu: systemctl --user restart wireplumber

monitor.bluez.properties = {
  bluez5.codecs = [ ldac aac sbc_xq sbc ]
  bluez5.enable-sbc-xq = true
  bluez5.enable-hw-volume = true
  bluez5.hw-volume = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]
}

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.a2dp.ldac.quality = "hq"
      }
    }
  }
]

wireplumber.settings = {
  ## "Zawsze pokazuj mikrofon i przełączaj na tryb zestawu podczas nagrywania"
  ## - wyłączone, bo to najczęstsza przyczyna zjazdu z LDAC na mSBC.
  bluetooth.autoswitch-to-headset-profile = false
  bluetooth.profile-preference = "quality"
}
